[package]
name = "inkpaper-note4"
version = "0.1.0"
edition = "2021"
resolver = "2"
rust-version = "1.82"

[[bin]]
name = "inkpaper-note4"
harness = false

[profile.release]
opt-level = "s"

[profile.dev]
debug = true
opt-level = "z"

[patch.crates-io]
esp-idf-hal = { path = "../vendor/esp-idf-hal" }

[dependencies]
anyhow = "1"
esp-idf-svc = { version = "0.52.1", features = ["critical-section"] }
heapless = "0.9"
log = "0.4"

[build-dependencies]
embuild = "0.33"

[[package.metadata.esp-idf-sys.extra_components]]
component_dirs = ["components/zectrix_epd"]
bindings_header = "components/zectrix_epd/include/zectrix_epd.h"
bindings_module = "zectrix_epd"
